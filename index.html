const sheet=document.createElement('dialog');sheet.id='sheet';sheet.style.cssText='background:#15222d;color:#e2eae8;border:1px solid #47616a;border-radius:8px;width:min(640px,90vw);max-height:85vh;padding:25px';document.body.appendChild(sheet);

'.').pop()||'TXT').slice(0,7).toUpperCase())}</span><div class="maintext"><strong>${esc(d.title)}</strong><div class="dim">${esc(d.updated)} · ${d.size?(d.size/1024).toFixed(1)+' KB':'文本笔记'}${d.binary?' · 原文件':''}</div></div><select data-doc-move="${d.id}" aria-label="移动文档">${folderOptions(d.folder)}</select>${d.binary?`<button class="smallbtn" data-preview="${d.id}">查看 / 下载</button>`:`<button class="smallbtn" data-doc-edit="${d.id}">打开</button>`}<button class="smallbtn" data-doc-delete="${d.id}">删除</button></div>`).join('')||'<div class="empty">此文件夹还没有资料</div>'}</div></div>`;let dz=document.getElementById('dropZone');dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='#c5ded8'};dz.ondragleave=()=>dz.style.borderColor='#45616a';dz.ondrop=e=>{e.preventDefault();intakeFiles([...e.dataTransfer.files])}};
const binaryInput=document.createElement('input');binaryInput.type='file';binaryInput.multiple=true;binaryInput.hidden=true;document.body.appendChild(binaryInput);binaryInput.onchange=()=>{intakeFiles([...binaryInput.files]);binaryInput.value=''};
let pendingFiles=[];
async function intakeFiles(files){pendingFiles=[];for(const file of files){let body='';if(/\.(txt|md|csv|json|log)$/i.test(file.name))body=(await file.text()).slice(0,20000);let date=new Date(file.lastModified).toISOString().slice(0,10),c=classify(file.name+' '+body,date);pendingFiles.push({file,body,date,c})}openSheet(`<h2 class="section-title">确认导入与归档</h2><p class="section-sub">匹配文件名与纯文本关键词；Office 和图片不做内容识别。未匹配时按文件修改月份建议，你可更改目标。</p><form id="binaryForm">${pendingFiles.map((x,i)=>`<div class="settings-row"><div><strong>${esc(x.file.name)}</strong><p>${esc(x.date)} · ${esc(x.c.reason)} · 建议 ${esc(x.c.label)}</p></div><select class="btn" name="folder${i}">${folderOptions(currentFolder!=='all'?currentFolder:x.c.folder)}${!x.c.folder?`<option value="month">${esc(x.c.label)}</option>`:''}</select></div>`).join('')}<button class="btn primary" style="margin-top:18px">保存到本地资料库</button></form>`)}

drawNetwork=function(){baseGalaxy();let c=document.getElementById('network'),ctx=c.getContext('2d');let tick=0;function galaxy(){if(!document.body.contains(c))return;tick++;let w=c.clientWidth,h=c.clientHeight;ctx.save();ctx.globalCompositeOperation='destination-over';let tilt=-.3;for(let i=0;i<1100;i++){let a=i*2.39996,r=Math.sqrt((i+.5)/1100),x=Math.cos(a)*r*w*.6,y=Math.sin(a)*r*h*.1;let xx=w*.5+x*Math.cos(tilt)-y*Math.sin(tilt),yy=h*.54+x*Math.sin(tilt)+y*Math.cos(tilt);ctx.globalAlpha=.13+(i%7)*.035;ctx.fillStyle=i%4?'#9bb8cc':'#d7c9ac';ctx.fillRect(xx,yy,i%17===0?1.5:.65,i%17===0?1.5:.65)}ctx.restore();requestAnimationFrame(galaxy)}requestAnimationFrame(galaxy)};
